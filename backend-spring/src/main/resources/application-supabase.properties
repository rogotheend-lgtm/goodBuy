# Supabase 접속값은 실행 환경에서만 주입하고 저장소에는 비밀값을 남기지 않습니다.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Session pooler와 무료 플랜의 연결 수를 아껴 사용합니다.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:1500}
spring.datasource.hikari.initialization-fail-timeout=-1

# Supabase 스키마는 DA가 관리하므로 Spring이 생성·수정·마이그레이션하지 않습니다.
spring.flyway.enabled=false
# DB 장애 시에도 부팅해 기본 카테고리로 분석할 수 있도록 시작 단계 검증은 하지 않습니다.
# 실제 매핑 문제는 읽기 전용 카테고리 쿼리 실패로 감지하고 기본값으로 대체합니다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.open-in-view=false
