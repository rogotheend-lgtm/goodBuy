spring.application.name=backend-spring
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/goodbuy}
spring.datasource.username=${DB_USERNAME:goodbuy}
spring.datasource.password=${DB_PASSWORD:goodbuy}
# 기본 실행도 DB 스키마를 만들거나 수정하지 않습니다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
goodbuy.ocr.mode=${OCR_MODE:mock}
goodbuy.ocr.base-url=${OCR_BASE_URL:http://localhost:8000}
goodbuy.ocr.parse-path=${OCR_PARSE_PATH:/ocr/extraction}
goodbuy.ocr.connect-timeout=${OCR_CONNECT_TIMEOUT:3s}
# 프론트의 이미지별 65초 제한보다 먼저 실패 응답을 반환하도록 맞춥니다.
goodbuy.ocr.read-timeout=${OCR_READ_TIMEOUT:60s}
goodbuy.web.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
springdoc.swagger-ui.path=/swagger.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
